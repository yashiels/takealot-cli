name: Release Implementation
on:
  workflow_call:
    inputs:
      bump:
        description: Version bump type
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Validate bump input
        run: |
          case "${{ inputs.bump }}" in
            patch|minor|major) ;;
            *) echo "Invalid bump value: '${{ inputs.bump }}'. Must be patch, minor, or major." >&2; exit 1 ;;
          esac

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Bump version
        id: version
        run: |
          MARKETING_VERSION=$(grep '^MARKETING_VERSION=' version.env | cut -d= -f2)
          BUILD_NUMBER=$(grep '^BUILD_NUMBER=' version.env | cut -d= -f2)
          IFS='.' read -r major minor patch <<< "$MARKETING_VERSION"

          case "${{ inputs.bump }}" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac

          NEW_VERSION="${major}.${minor}.${patch}"
          NEW_BUILD=$((BUILD_NUMBER + 1))

          echo "MARKETING_VERSION=${NEW_VERSION}" > version.env
          echo "BUILD_NUMBER=${NEW_BUILD}" >> version.env

          # Update package.json version
          node -e "
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.version = '${NEW_VERSION}';
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

          # Keep the hardcoded CLI version in sync (source of `takealot --version`)
          node -e "
          const fs = require('fs');
          let s = fs.readFileSync('src/cli.ts', 'utf8');
          s = s.replace(/const VERSION = '[^']*';/, \"const VERSION = '${NEW_VERSION}';\");
          fs.writeFileSync('src/cli.ts', s);
          "

          echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "build=${NEW_BUILD}" >> "$GITHUB_OUTPUT"
          echo "Bumped to v${NEW_VERSION} (build ${NEW_BUILD})"

      - name: Install dependencies
        run: npm ci

      - name: Build macOS arm64 binary
        run: bun build --compile src/cli.ts --outfile takealot

      - name: Build Linux x64 binary
        run: |
          bun build --compile --target=bun-linux-x64 src/cli.ts --outfile takealot-linux-x64
          mv takealot-linux-x64 takealot-linux

      - name: Create tarballs
        id: tarballs
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          # macOS arm64
          MACOS_TAR="takealot-v${VERSION}-darwin-arm64.tar.gz"
          tar -czf "$MACOS_TAR" takealot
          MACOS_SHA=$(shasum -a 256 "$MACOS_TAR" | awk '{print $1}')

          # Linux x64
          LINUX_TAR="takealot-v${VERSION}-linux-x64.tar.gz"
          mv takealot-linux takealot
          tar -czf "$LINUX_TAR" takealot
          LINUX_SHA=$(shasum -a 256 "$LINUX_TAR" | awk '{print $1}')

          echo "macos_tar=${MACOS_TAR}" >> "$GITHUB_OUTPUT"
          echo "macos_sha=${MACOS_SHA}" >> "$GITHUB_OUTPUT"
          echo "linux_tar=${LINUX_TAR}" >> "$GITHUB_OUTPUT"
          echo "linux_sha=${LINUX_SHA}" >> "$GITHUB_OUTPUT"
          echo "macOS SHA-256: ${MACOS_SHA}"
          echo "Linux SHA-256: ${LINUX_SHA}"

      - name: Commit version bump (verified, via GitHub API)
        env:
          # The default GITHUB_TOKEN is evaluated as the GitHub Actions
          # integration, which cannot bypass the main-branch ruleset on a
          # user-owned repo. Use a PAT owned by a bypass user instead so the
          # verified version-bump commit can land on main.
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BRANCH="${GITHUB_REF_NAME}"
          HEAD_OID=$(git rev-parse HEAD)

          # Commits created through the GraphQL API are GPG-signed by GitHub's
          # web-flow key and land as "Verified", satisfying the branch-protection
          # rule "Commits must have verified signatures". The release tag is then
          # created by the "Create GitHub Release" step at this new HEAD.
          additions=$(jq -n \
            --arg p1 version.env  --arg c1 "$(base64 < version.env | tr -d '\n')" \
            --arg p2 package.json --arg c2 "$(base64 < package.json | tr -d '\n')" \
            --arg p3 src/cli.ts   --arg c3 "$(base64 < src/cli.ts | tr -d '\n')" \
            '[{path:$p1,contents:$c1},{path:$p2,contents:$c2},{path:$p3,contents:$c3}]')

          jq -n \
            --arg repo "${{ github.repository }}" \
            --arg branch "$BRANCH" \
            --arg oid "$HEAD_OID" \
            --arg headline "chore(release): bump version to ${VERSION}" \
            --argjson additions "$additions" \
            '{query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid url } } }",
              variables: {input: {
                branch: {repositoryNameWithOwner: $repo, branchName: $branch},
                expectedHeadOid: $oid,
                message: {headline: $headline},
                fileChanges: {additions: $additions}
              }}}' \
            | gh api graphql --input -

      - name: Create GitHub Release
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          MACOS_SHA="${{ steps.tarballs.outputs.macos_sha }}"
          NOTES="### Install"$'\n'"brew install yashiels/tap/takealot"$'\n\n'"Or download a tarball below."$'\n\n'"**macOS arm64 SHA-256:** ${MACOS_SHA}"
          gh release create "v${VERSION}" \
            "${{ steps.tarballs.outputs.macos_tar }}" \
            "${{ steps.tarballs.outputs.linux_tar }}" \
            --title "takealot v${VERSION}" \
            --generate-notes \
            --notes "$NOTES"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Homebrew tap (signed commit)
        env:
          # HOMEBREW_TAP_TOKEN is owned by a bypass user, so createCommitOnBranch
          # lands a GitHub-signed ("Verified") commit that also satisfies the
          # tap's branch ruleset — unlike a plain github-actions[bot] git push.
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          SHA="${{ steps.tarballs.outputs.macos_sha }}"
          TAP="yashiels/homebrew-tap"
          BRANCH="main"
          FORMULA="takealot"

          content=$(cat <<EOF
          class Takealot < Formula
            desc "CLI for Takealot.com"
            homepage "https://github.com/yashiels/takealot-cli"
            version "${VERSION}"

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/yashiels/takealot-cli/releases/download/v${VERSION}/takealot-v${VERSION}-darwin-arm64.tar.gz"
                sha256 "${SHA}"
              end
            end

            def install
              bin.install "takealot"
            end

            test do
              system bin/"takealot", "--version"
            end
          end
          EOF
          )
          # Strip the 10-space indent this step's heredoc adds to each line.
          content=$(printf '%s\n' "$content" | sed 's/^          //')
          b64=$(printf '%s' "$content" | base64 | tr -d '\n')

          for attempt in 1 2 3 4 5; do
            oid=$(gh api "repos/${TAP}/git/ref/heads/${BRANCH}" --jq '.object.sha')
            payload=$(jq -n \
              --arg repo "$TAP" --arg branch "$BRANCH" --arg oid "$oid" \
              --arg headline "${FORMULA}: update formula for v${VERSION}" \
              --arg path "Formula/${FORMULA}.rb" --arg c "$b64" \
              '{query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { url } } }",
                variables: {input: {branch: {repositoryNameWithOwner: $repo, branchName: $branch}, expectedHeadOid: $oid, message: {headline: $headline}, fileChanges: {additions: [{path: $path, contents: $c}]}}}}')
            if out=$(printf '%s' "$payload" | gh api graphql --input - 2>&1); then
              url=$(printf '%s' "$out" | jq -r '.data.createCommitOnBranch.commit.url // empty')
              if [ -n "$url" ]; then echo "Homebrew tap updated (verified): $url"; exit 0; fi
              echo "attempt $attempt: no commit in response: $out"
            else
              echo "attempt $attempt failed: $out"
            fi
            sleep $((attempt * 2))
          done
          echo "Failed to update Homebrew tap after retries" >&2
          exit 1

      - name: Upload artifacts
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4
        with:
          name: takealot-v${{ steps.version.outputs.version }}-binaries
          path: |
            ${{ steps.tarballs.outputs.macos_tar }}
            ${{ steps.tarballs.outputs.linux_tar }}
